[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer"
version = "0.1.0"
description = "PGN move-quality analysis using the Stockfish Online API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]