[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer"
version = "0.1.0"
description = "PGN move-quality analysis using a local Stockfish UCI engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2.8,<5.3",
    "chess.com>=3.13,<4",
    "python-chess>=1.999,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2,<3",
    "requests>=2.32,<3",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
web = ["gunicorn>=23,<24"]
notebook = ["ipykernel>=6,<8"]
rating = [
    "chess-rating-estimator[engine] @ git+https://github.com/MCodrescu/ELO-Estimator.git@e9867d40a996dee6a98ddbaf2a52bce0c2ab2078",
    "filelock>=3.16,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chess_analyzer.web" = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in tests requiring an installed Stockfish executable"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]