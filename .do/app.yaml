name: chess-analyzer
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_OWNER/YOUR_REPOSITORY
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DJANGO_DEBUG
        scope: RUN_TIME
        value: "0"
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DJANGO_BASIC_AUTH_USERNAME
        scope: RUN_TIME
        value: reviewer
      - key: DJANGO_BASIC_AUTH_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DJANGO_ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: DJANGO_TRUST_PROXY
        scope: RUN_TIME
        value: "1"
      - key: STOCKFISH_THREADS
        scope: RUN_TIME
        value: "1"
      - key: STOCKFISH_HASH_MB
        scope: RUN_TIME
        value: "64"
      - key: STOCKFISH_TIME_SECONDS
        scope: RUN_TIME
        value: "0.1"
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /