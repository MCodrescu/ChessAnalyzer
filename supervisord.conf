[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/chess-analyzer-supervisord.pid
childlogdir=/tmp

[program:rating-worker]
directory=/app
command=python -u manage.py rating_worker
priority=10
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
directory=/app
command=gunicorn --config gunicorn.conf.py chess_analyzer.web.wsgi:application
priority=20
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=190
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0